<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>挪对对超解压</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="app" id="app">
      <section class="phone">
        <div class="status-bar">
          <span>10:48</span>
          <span class="signal">●●●</span>
        </div>

        <header class="game-header">
          <div>
            <p class="eyebrow">麻将对对碰</p>
            <h1>挪对对超解压</h1>
            <p>看似简单，玩着就沉下去了</p>
          </div>
          <div class="coin-pill" aria-label="金币">
            <span>¥</span>
            <strong data-ui="coins">0</strong>
          </div>
        </header>

        <section class="level-card">
          <div>
            <span>关卡</span>
            <strong>第 <em data-ui="level">1</em> 关</strong>
          </div>
          <div class="remain-badge">
            <strong data-ui="remaining">0</strong>
            <span>剩余</span>
          </div>
        </section>

        <section class="metrics" aria-label="本局数据">
          <div>
            <strong data-ui="score">0</strong>
            <span>得分</span>
          </div>
          <div>
            <strong data-ui="steps">0</strong>
            <span>步数</span>
          </div>
          <div>
            <strong data-ui="combo">0</strong>
            <span>连击</span>
          </div>
        </section>

        <div class="message" data-ui="message">点击相同麻将，同行或同列无遮挡即可消除</div>

        <section class="board-shell">
          <div class="board" data-ui="board" aria-label="麻将棋盘"></div>
        </section>

        <p class="rules">相邻相同可直接消除；同行或同列中间没有牌，也可以连线消除。</p>

        <nav class="actions" aria-label="游戏操作">
          <button type="button" data-action="shuffle">洗牌</button>
          <button type="button" data-action="restart">重开</button>
          <button type="button" class="primary" data-action="next">消完过关</button>
        </nav>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
